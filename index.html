<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PHP Evolution — Card Stack</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at center, #1c2233 0%, #07090f 100%);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    color: #fff;
  }

  .scene {
    position: fixed;
    inset: 0;
    perspective: 1800px;
    perspective-origin: 50% 45%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .deck {
    position: relative;
    width: 280px;
    height: 600px;
    transform-style: preserve-3d;
    transform: rotateY(-14deg) rotateX(6deg);
  }

  .card {
    position: absolute;
    inset: 0;
    border-radius: 30px;
    overflow: hidden;
    background: #fff;
    box-shadow:
      0 30px 60px rgba(0, 0, 0, 0.55),
      0 12px 24px rgba(0, 0, 0, 0.35),
      0 0 0 1px rgba(255, 255, 255, 0.06);
    backface-visibility: hidden;
    will-change: transform, opacity;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }

  .controls {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 100;
    opacity: 0.35;
    transition: opacity 0.25s ease;
  }
  .controls:hover { opacity: 1; }

  .controls button {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 0.02em;
    cursor: pointer;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: background 0.2s;
  }
  .controls button:hover {
    background: rgba(255,255,255,0.18);
  }

  .loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    letter-spacing: 0.05em;
    z-index: 200;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .loading.hidden { opacity: 0; }
</style>
</head>
<body>
  <div class="scene">
    <div class="deck" id="deck"></div>
  </div>

  <div class="loading" id="loading">loading…</div>

  <div class="controls">
    <button id="playPause">Pause</button>
    <button id="restart">Restart</button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const TOTAL = 23;
  const GAP_X = 4;
  const GAP_Y = 6;
  const GAP_Z = 20;
  const FLICK_DURATION = 0.7;
  const HOLD_DURATION  = 1.1;
  const END_PAUSE      = 2.2;

  const deck = document.getElementById('deck');
  const cards = [];
  let frontIndex = 0;
  let playing = true;
  let pendingCall = null;

  for (let i = 0; i < TOTAL; i++) {
    const card = document.createElement('div');
    card.className = 'card';
    const img = document.createElement('img');
    img.src = `${i + 1}.png`;
    img.alt = `Version ${i + 1}`;
    card.appendChild(img);
    deck.appendChild(card);
    cards.push(card);
  }

  function placeCard(card, offset) {
    gsap.set(card, {
      z: -offset * GAP_Z,
      y:  offset * GAP_Y,
      x:  offset * GAP_X,
      rotationX: 0,
      rotationY: 0,
      opacity: 1
    });
  }

  function hideFlicked(card) {
    gsap.set(card, { opacity: 0, z: 800, y: -350, x: 140, rotationX: 45, rotationY: 25 });
  }

  function positionAll() {
    cards.forEach((card, i) => {
      const offset = i - frontIndex;
      if (offset < 0) hideFlicked(card);
      else placeCard(card, offset);
    });
  }

  function flickNext() {
    if (frontIndex >= TOTAL - 1) return false;

    const flying = cards[frontIndex];
    const tl = gsap.timeline();

    tl.to(flying, {
      z: 800,
      y: -350,
      x: 140,
      rotationX: 45,
      rotationY: 25,
      opacity: 0,
      duration: FLICK_DURATION,
      ease: "power2.in"
    }, 0);

    for (let i = frontIndex + 1; i < TOTAL; i++) {
      const newOffset = i - (frontIndex + 1);
      tl.to(cards[i], {
        z: -newOffset * GAP_Z,
        y:  newOffset * GAP_Y,
        x:  newOffset * GAP_X,
        duration: FLICK_DURATION,
        ease: "power2.out"
      }, 0);
    }

    frontIndex++;
    return true;
  }

  function loop() {
    if (!playing) return;

    if (frontIndex >= TOTAL - 1) {
      pendingCall = gsap.delayedCall(END_PAUSE, () => { if (playing) restart(); });
      return;
    }

    pendingCall = gsap.delayedCall(HOLD_DURATION, () => {
      if (!playing) return;
      flickNext();
      loop();
    });
  }

  function restart() {
    if (pendingCall) pendingCall.kill();
    frontIndex = 0;
    positionAll();
    if (playing) loop();
  }

  positionAll();

  const imgs = deck.querySelectorAll('img');
  Promise.all([...imgs].map(img =>
    img.complete
      ? Promise.resolve()
      : new Promise(res => { img.onload = img.onerror = res; })
  )).then(() => {
    document.getElementById('loading').classList.add('hidden');
    gsap.delayedCall(0.5, loop);
  });

  const playPauseBtn = document.getElementById('playPause');
  playPauseBtn.addEventListener('click', () => {
    playing = !playing;
    playPauseBtn.textContent = playing ? 'Pause' : 'Play';
    if (playing) loop();
    else if (pendingCall) pendingCall.kill();
  });

  document.getElementById('restart').addEventListener('click', restart);

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      playPauseBtn.click();
    } else if (e.code === 'ArrowRight') {
      playing = false;
      playPauseBtn.textContent = 'Play';
      if (pendingCall) pendingCall.kill();
      flickNext();
    } else if (e.code === 'KeyR') {
      restart();
    }
  });
</script>
</body>
</html>
