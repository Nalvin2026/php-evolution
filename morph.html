<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PHP Evolution — Morph Reel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at center, #1c2233 0%, #07090f 100%);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    color: #fff;
  }

  .scene {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone {
    position: relative;
    width: 300px;
    height: 640px;
    background: linear-gradient(160deg, #2a2a2e 0%, #131316 100%);
    border-radius: 46px;
    padding: 10px;
    box-shadow:
      0 60px 110px rgba(0, 0, 0, 0.55),
      0 22px 44px rgba(0, 0, 0, 0.4),
      0 0 0 1px rgba(255, 255, 255, 0.06),
      inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    animation: float 7s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: 36px;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
  }

  .frame {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.55s ease-in-out;
    will-change: opacity;
  }
  .frame.active { opacity: 1; }

  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }

  .controls {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 100;
    opacity: 0.35;
    transition: opacity 0.25s ease;
  }
  .controls:hover { opacity: 1; }

  .controls button {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 0.02em;
    cursor: pointer;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: background 0.2s;
  }
  .controls button:hover {
    background: rgba(255,255,255,0.18);
  }

  .loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    letter-spacing: 0.05em;
    z-index: 200;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .loading.hidden { opacity: 0; }
</style>
</head>
<body>
  <div class="scene">
    <div class="phone">
      <div class="screen" id="screenEl"></div>
    </div>
  </div>

  <div class="loading" id="loading">loading…</div>

  <div class="controls">
    <button id="playPause">Pause</button>
    <button id="restart">Restart</button>
  </div>

<script>
  const TOTAL = 23;
  const HOLD = 1000;       // ms at full opacity
  const FADE = 550;        // ms cross-fade (matches CSS)
  const END_PAUSE = 2200;  // ms pause before looping

  const screenEl = document.getElementById('screenEl');
  const frames = [];
  let active = 0;
  let playing = true;
  let timer = null;

  for (let i = 0; i < TOTAL; i++) {
    const f = document.createElement('div');
    f.className = 'frame' + (i === 0 ? ' active' : '');
    const img = document.createElement('img');
    img.src = `${i + 1}.png`;
    img.alt = `Version ${i + 1}`;
    f.appendChild(img);
    screenEl.appendChild(f);
    frames.push(f);
  }

  function advance() {
    if (active >= TOTAL - 1) return false;
    frames[active].classList.remove('active');
    active++;
    frames[active].classList.add('active');
    return true;
  }

  function loop() {
    if (!playing) return;

    if (active >= TOTAL - 1) {
      timer = setTimeout(() => { if (playing) restart(); }, END_PAUSE);
      return;
    }

    timer = setTimeout(() => {
      if (!playing) return;
      advance();
      loop();
    }, HOLD + FADE);
  }

  function restart() {
    if (timer) { clearTimeout(timer); timer = null; }
    frames.forEach((f, i) => f.classList.toggle('active', i === 0));
    active = 0;
    if (playing) loop();
  }

  const imgs = screenEl.querySelectorAll('img');
  Promise.all([...imgs].map(img =>
    img.complete
      ? Promise.resolve()
      : new Promise(res => { img.onload = img.onerror = res; })
  )).then(() => {
    document.getElementById('loading').classList.add('hidden');
    setTimeout(loop, 600);
  });

  const playPauseBtn = document.getElementById('playPause');
  playPauseBtn.addEventListener('click', () => {
    playing = !playing;
    playPauseBtn.textContent = playing ? 'Pause' : 'Play';
    if (playing) loop();
    else if (timer) { clearTimeout(timer); timer = null; }
  });

  document.getElementById('restart').addEventListener('click', restart);

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      playPauseBtn.click();
    } else if (e.code === 'ArrowRight') {
      playing = false;
      playPauseBtn.textContent = 'Play';
      if (timer) { clearTimeout(timer); timer = null; }
      advance();
    } else if (e.code === 'KeyR') {
      restart();
    }
  });
</script>
</body>
</html>
